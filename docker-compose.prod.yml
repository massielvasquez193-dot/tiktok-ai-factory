version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: tiktok-vf-db
    environment:
      POSTGRES_USER: ${DB_USER:-tiktok}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme123}
      POSTGRES_DB: ${DB_NAME:-tiktok_video_factory}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # ports: ["5432:5432"]  -- removed: public exposure, server uses Docker DNS postgres:5432
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tiktok} -d ${DB_NAME:-tiktok_video_factory}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tiktok-vf-redis
    # ports: ["6379:6379"]  -- removed: public exposure, server uses Docker DNS redis:6379
    restart: unless-stopped
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: ./apps/server/Dockerfile.prod
    container_name: tiktok-vf-server
    environment:
      DATABASE_URL: "postgresql://${DB_USER:-tiktok}:${DB_PASSWORD:-changeme123}@postgres:5432/${DB_NAME:-tiktok_video_factory}"
      REDIS_URL: "redis://redis:6379"
      NODE_ENV: production
      PORT: "4000"
      SEEDANCE_API_KEY: "${SEEDANCE_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      LLM_MODE: "real"
      SEEDANCE_MODE: "real"
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.prod
    container_name: tiktok-vf-web
    environment:
      NEXT_PUBLIC_API_URL: "http://server:4000"
    ports: ["3000:3000"]
    depends_on: [server]
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: tiktok-vf-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on: [web, server]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
