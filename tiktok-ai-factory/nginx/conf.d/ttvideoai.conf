# ============================================================
# ttvideoai.com — Nginx Reverse Proxy (Ubuntu Host)
# ============================================================
# 位置: /etc/nginx/conf.d/ttvideoai.conf
# SSL:  Let's Encrypt (待申请)
# ============================================================

# ─── HTTP → 代理到 Docker 容器 ──────────────────────────
server {
    listen 80;
    server_name ttvideoai.com www.ttvideoai.com;

    # Let's Encrypt ACME 验证 (后续 SSL 使用)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    # API 反向代理 → Express (容器端口 4000)
    location /api/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # 上传文件 / 输出文件
    location /uploads/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        expires 7d;
    }

    location /output/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        expires 30d;
    }

    # 前端 → Next.js (容器端口 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

