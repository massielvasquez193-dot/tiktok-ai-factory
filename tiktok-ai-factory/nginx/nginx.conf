# ============================================================
# TikTok AI Factory — Nginx Production Configuration
# ============================================================
# Includes: SSL termination, Cloudflare real-IP, WAF rules,
#           rate limiting, gzip, security headers, caching
# ============================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 4096;
  use epoll;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # ─── Logging ──────────────────────────────────────────
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for" '
                  'rt=$request_time uct="$upstream_connect_time" '
                  'uht="$upstream_header_time" urt="$upstream_response_time" '
                  'pipe=$pipe';

  access_log /var/log/nginx/access.log main buffer=16k flush=5s;
  log_not_found off;

  # ─── Basic Optimization ───────────────────────────────
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  keepalive_requests 1000;
  reset_timedout_connection on;
  client_body_timeout 30;
  send_timeout 30;
  client_max_body_size 500m;           # Video upload support
  client_body_buffer_size 128k;
  server_tokens off;

  # ─── Gzip Compression ─────────────────────────────────
  gzip on;
  gzip_static on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types
    text/plain text/css text/xml text/javascript
    application/json application/javascript application/xml+rss
    application/x-javascript application/atom+xml
    image/svg+xml font/ttf font/otf font/woff2;

  # ─── Cloudflare — Trusted Real-IP ─────────────────────
  # To restrict to Cloudflare only, uncomment the set_real_ip_from line.
  # Include Cloudflare IPs:
  #   curl -s https://www.cloudflare.com/ips-v4 > /etc/nginx/cloudflare.conf
  #   curl -s https://www.cloudflare.com/ips-v6 >> /etc/nginx/cloudflare.conf
  # Then uncomment:
  # include /etc/nginx/cloudflare.conf;
  # real_ip_header CF-Connecting-IP;

  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # ─── Rate Limiting ────────────────────────────────────
  # General API rate limit
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
  # Auth endpoints — stricter
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
  # Stripe webhook — per IP burst
  limit_req_zone $binary_remote_addr zone=webhook_limit:5m rate=60r/s;
  # Global connection limit
  limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

  # ─── Upstream Definitions ─────────────────────────────
  upstream web_upstream {
    least_conn;
    server web:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
  }

  upstream server_upstream {
    least_conn;
    server server:4000 max_fails=3 fail_timeout=30s;
    keepalive 64;
  }

  # ─── HTTP → HTTPS Redirect ────────────────────────────
  server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name ttvideoai.com www.ttvideoai.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
      allow all;
    }

    # Nginx health check endpoint (no auth)
    location = /health {
      access_log off;
      return 200 "nginx OK\n";
      add_header Content-Type text/plain;
    }

    # All other traffic → HTTPS
    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ─── HTTPS Server ─────────────────────────────────────
  server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ttvideoai.com www.ttvideoai.com;

    # ════════════════════════════════════════════════════
    # SSL Configuration
    # ════════════════════════════════════════════════════

    # Primary certificate (Let's Encrypt DNS-01 via certbot)
    ssl_certificate     /etc/nginx/ssl/live/ttvideoai.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/ttvideoai.com/privkey.pem;

    # SSL session cache
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Modern TLS only
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # HTTP Strict Transport Security (HSTS)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ════════════════════════════════════════════════════
    # Security Headers
    # ════════════════════════════════════════════════════

    # Cross-Site Scripting protection
    add_header X-XSS-Protection "1; mode=block" always;

    # MIME sniffing prevention
    add_header X-Content-Type-Options "nosniff" always;

    # Clickjacking prevention
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Referrer policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions policy
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self' https://api.stripe.com https://*.cloudflare.com; frame-src https://js.stripe.com https://hooks.stripe.com" always;

    # Cross-Origin policies
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # ════════════════════════════════════════════════════
    # Connection Limits
    # ════════════════════════════════════════════════════
    limit_conn conn_limit 100;

    # ════════════════════════════════════════════════════
    # Proxy Settings
    # ════════════════════════════════════════════════════
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # Proxy buffers
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 64 16k;
    proxy_busy_buffers_size 32k;
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;

    # Let's Encrypt ACME challenge (for renewal)
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
      allow all;
    }

    # ════════════════════════════════════════════════════
    # API Routes — Rate Limited
    # ════════════════════════════════════════════════════

    # Stripe Webhook — no auth, higher burst
    location /api/payments/webhook {
      limit_req zone=webhook_limit burst=100 nodelay;
      proxy_pass http://server_upstream;
    }

    # Auth endpoints — strict rate limit
    location /api/auth/ {
      limit_req zone=auth_limit burst=10 nodelay;
      proxy_pass http://server_upstream;
    }

    # Admin endpoints — strict rate limit
    location /api/admin/ {
      limit_req zone=auth_limit burst=20 nodelay;
      proxy_pass http://server_upstream;
    }

    # General API
    location /api/ {
      limit_req zone=api_limit burst=50 nodelay;
      proxy_pass http://server_upstream;
    }

    # ════════════════════════════════════════════════════
    # Static Files — Cached
    # ════════════════════════════════════════════════════
    location /uploads/ {
      proxy_pass http://server_upstream;
      expires 7d;
      add_header Cache-Control "public, immutable";
      add_header X-Cache-Status $upstream_cache_status;
    }

    location /output/ {
      proxy_pass http://server_upstream;
      expires 30d;
      add_header Cache-Control "public, immutable";
      add_header X-Cache-Status $upstream_cache_status;
    }

    # Next.js static assets
    location /_next/static/ {
      proxy_pass http://web_upstream;
      proxy_cache_valid 200 365d;
      add_header Cache-Control "public, immutable";
      expires 365d;
    }

    # ════════════════════════════════════════════════════
    # Web Frontend — All Other Routes
    # ════════════════════════════════════════════════════
    location / {
      proxy_pass http://web_upstream;

      # WebSocket support (Next.js HMR in dev)
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      # Next.js specific
      proxy_intercept_errors on;
      error_page 404 =200 /;
    }

    # ════════════════════════════════════════════════════
    # Deny Hidden Files & Sensitive Paths
    # ════════════════════════════════════════════════════
    location ~ /\. {
      deny all;
      access_log off;
      log_not_found off;
    }

    location ~* \.(sql|log|md|yml|yaml|lock|json|map)$ {
      deny all;
      access_log off;
      log_not_found off;
    }

    # ════════════════════════════════════════════════════
    # WAF: Block Common Attacks
    # ════════════════════════════════════════════════════

    # SQL Injection
    set $block_sql 0;
    if ($query_string ~* "union.*select.*(")         { set $block_sql 1; }
    if ($query_string ~* "union.*all.*select.*")     { set $block_sql 1; }
    if ($query_string ~* "concat.*(.*)")             { set $block_sql 1; }
    if ($args ~* "(<|%3C).*script.*(>|%3E)")        { set $block_sql 1; }
    if ($block_sql = 1) { return 403; }

    # Path traversal / LFI
    set $block_lfi 0;
    if ($uri ~* "\.\.\/")                            { set $block_lfi 1; }
    if ($uri ~* "\.\.\%2F")                          { set $block_lfi 1; }
    if ($uri ~* "\/etc\/")                           { set $block_lfi 1; }
    if ($block_lfi = 1) { return 403; }

    # Block bad bots
    if ($http_user_agent ~* (scrapy|curl|wget|python|nikto|sqlmap|nmap|masscan|zgrab|gobuster|dirbuster|hydra)) {
      return 403;
    }
  }

  # ═══════════════════════════════════════════════════════
  # Include additional site configs
  # ═══════════════════════════════════════════════════════
  include /etc/nginx/conf.d/*.conf;
}
