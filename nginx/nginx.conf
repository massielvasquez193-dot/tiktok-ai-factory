events { worker_connections 1024; }
http {
  include mime.types; sendfile on; gzip on;
  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
  upstream web { server web:3000; }
  upstream server { server server:4000; }

  # ── HTTP (redirect to HTTPS) ──────────────────────────────────────────────

  server {
    listen 80;
    server_name ttvideoai.com www.ttvideoai.com;
    return 301 https://$host$request_uri;
  }

  # fallback for direct IP/health checks
  server {
    listen 80 default_server;
    server_name _;

    location /api/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://server;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /uploads/ { proxy_pass http://server; }
    location /output/  { proxy_pass http://server; }

    location / {
      proxy_pass http://web;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }
  }

  # ── HTTPS ────────────────────────────────────────────────────────────────

  server {
    listen 443 ssl;
    server_name ttvideoai.com www.ttvideoai.com;

    ssl_certificate     /etc/nginx/ssl/live/ttvideoai.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/ttvideoai.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location /api/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://server;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
      proxy_pass http://server;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /output/ {
      proxy_pass http://server;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://web;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
